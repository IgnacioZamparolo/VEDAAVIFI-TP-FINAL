{% extends 'base_admin.html' %}
{% block title %}Parrilla Argentina — Página no encontrada{% endblock %}
{% block content %}
<section class="hero">
    <div class="hero__content">
        <h1 class="hero__title">404</h1>
         <p class="hero__subtitle">{{ error.description if error and error.description else 'La página que buscás no existe.' }}</p>
        <a href="{{ url_for('frontend.home') }}" class="form__btn form__btn--submit">Volver al inicio</a>
    </div>
</section>
{% endblock %}
