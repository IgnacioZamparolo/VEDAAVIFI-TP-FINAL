{% extends "base_admin.html" %}

{% block title %}Editar Servicios Extras - Parrilla Argentina{% endblock %}

{% block content %}

<table border="1">
    <thead>
        <tr>
            <th>ID Servicio</th>
            <th>Nombre</th>
            <th>Descripción</th>
        </tr>
    </thead>
    <tbody>
        {% for servicio in servicios %}
        <tr>
            <td>{{ servicio.id_servicio }}</td> 
            <td>{{ servicio.nombre }}</td> 
            <td>{{ servicio.descripcion }}</td>                     
        </tr>
        {% endfor %}
    </tbody>
</table>
<div>
    <ul class="botones-form">
        <li><button class="form__btn" id="btn-editar-servicio">Editar</button></li>
        <li><button class="form__btn" id="btn-agregar-servicio">Agregar</button></li>
        <li><button class="form__btn" id="btn-eliminar-servicio">Eliminar</button></li>
    </ul>
</div>
<div class="form" id="agregar_servicio" style="display:none">
    <form action="{{ url_for('servicios.agregar')}}" method="POST">
        <label class="form__label" for="nombre">Nombre del servicio:</label>
        <input class="form__input" type="text" id="nombre" name="nombre" placeholder="Nombre" required>

        <label class="form__label" for="descripcion">Descripción:</label>
        <input class="form__input" type="text" id="descripcion" rows=4 name="descripcion" placeholder="descripcion" required>

        <button class="form__btn--submit" type="submit">Enviar</button>
    </form>
</div>

<div class="form" id="eliminar_servicio" style="display:none">
    <form id="form-eliminar" method="POST">
        <label class="form__label" for="select-eliminar">Servicio a eliminar: </label>
         <select class="form__input" id="select-eliminar" required>
            {% for servicio in servicios %}
                <option value="{{ servicio.id_servicio }}">{{ servicio.id_servicio }} - {{ servicio.nombre }}</option>
            {% endfor %}
        </select>
        <button class="form__btn--submit" type="button" id="btn-confirmar-eliminar">Eliminar</button>
    </form>
</div>

<div class="form" id="editar_servicio" style="display:none">
    <form id="form-editar" method="POST">
        <label class="form__label" for="select-editar">Servicio a editar:</label>
         <select class="form__input" id="select-editar">
            <option value="">Seleccioná un servicio </option>
                {% for servicio in servicios %}
                    <option value="{{ servicio.id_servicio }}" 
                            data-nombre="{{ servicio.nombre }}" 
                            data-descripcion="{{ servicio.descripcion }}">
                        {{ servicio.id_servicio }} - {{ servicio.nombre }}
                    </option>
                {% endfor %}
        </select>


        <label class="form__label" for="nombre">Nombre del servicio:</label>
        <input class="form__input" type="text" id="nombre" name="nombre" placeholder="Nombre" required>

        <label class="form__label" for="descripcion">Descripción:</label>
        <input class="form__input" type="text" id="descripcion" rows=4 name="descripcion" placeholder="descripcion" required>


        <button class="form__btn--submit" type="submit">Enviar</button>
    </form>
</div>
{% endblock %}
