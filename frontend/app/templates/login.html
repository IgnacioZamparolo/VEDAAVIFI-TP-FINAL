{% extends 'base_admin.html' %}

{% block title %}Parrilla Argentina — Iniciar sesión{% endblock %}

{% block content %}
<section class="hero">
  <div class="hero__content">
    <h1 class="hero__title">Panel Administrativo</h1>
    <p class="hero__subtitle">Ingresá con tus credenciales para continuar.</p>
  </div>
</section>

<section class="search-section">
  <div class="search-card">
    <form action="{{ url_for('auth.login') }}" method="POST" class="form">

      <div class="form__group">
        <label for="mail" class="form__label">Email</label>
        <input
          type="email"
          id="mail"
          name="mail"
          class="form__input"
          placeholder="admin@parrillaargentina.com"
          required
          autofocus
          autocomplete="email"
        />
      </div>

      <div class="form__group">
        <label for="password" class="form__label">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form__input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="form__actions form__actions--single">
        <button type="submit" class="form__btn form__btn--submit">Ingresar</button>
      </div>

    </form>
  </div>
</section>
{% endblock %}
